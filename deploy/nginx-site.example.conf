# Copy to /etc/nginx/sites-available/torcap-<client>. Change domain and port.
# Keep the limit_req_zone line in ONE file only.
limit_req_zone $binary_remote_addr zone=authlimit:10m rate=5r/m;

server {
    listen 80;
    server_name portal.yourcompany.com;
    client_max_body_size 2m;

    location /api/auth/ {
        limit_req zone=authlimit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
